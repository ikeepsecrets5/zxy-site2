<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ranking Real - VOID RNG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">VOID RNG<small>ANIME • AURA • KAKERA</small></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="commands.html">Comandos</a>
    <a href="ranking.html">Ranking</a>
    <a href="shop.html">Kakera Shop</a>
    <a href="verify.html">Verificação</a>
  </nav>
</header>


<section class="section">
  <h1 class="section-title">Ranking Real</h1>
  <div class="notice" id="rankStatus">Carregando ranking...</div>
  <div class="rank-tools">
    <input id="rankSearch" placeholder="Buscar player ou aura...">
    <select id="rankType">
      <option value="kakera">Kakera</option>
      <option value="collection">Coleção</option>
      <option value="luck">Luck</option>
    </select>
  </div>
  <div class="rank-list" id="rankList"></div>
</section>


<div class="modal-bg" id="verifyModal">
  <div class="modal">
    <h2>🔐 Verificação</h2>
    <p style="color:#a1a1aa">Cole sua key privada. Isso é só um preview visual; a verificação real acontece no Discord pelo bot.</p>
    <input id="verifyKey" placeholder="Cole sua key privada aqui">
    <button class="btn" onclick="fakeVerify()">Verificar</button>
    <button class="btn secondary" onclick="closeVerify()">Fechar</button>
    <p id="verifyResult"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<footer>VOID RNG © 2026 • Dashboard oficial</footer>
<script src="js/script.js"></script>
</body>
</html>
